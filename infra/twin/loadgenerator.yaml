# Bộ sinh tải chạy BÊN TRONG namespace twin, giống hệt production.
#
# VÌ SAO KHÔNG DÙNG port-forward NỮA — đo thật rồi mới biết:
#
#   3 nguoi dung  qua port-forward:   7% loi
#   10 nguoi dung qua port-forward:  53.7% loi, 117/218 request DUT KET NOI
#   twin do duoc:  frontend 0.20 req/s, moi service con lai 0.00
#
# `kubectl port-forward` là một tiến trình đơn ghép kênh qua một kết nối duy nhất,
# không chịu nổi 10 luồng song song. Ở mức tải bằng production thì nó sập.
#
# Còn một lý do nặng hơn cả chuyện sập: đẩy tải từ Windows qua đường hầm **cộng thêm
# độ trễ mà production không có**, vì production sinh tải từ trong cluster. Ngay cả
# khi đường hầm không sập, số đo hai bên vẫn không so sánh được.
#
# Ban đầu tớ loại phương án này để tiết kiệm 50 MiB RAM. Đó là đánh đổi sai: RAM chưa
# bao giờ là ràng buộc thật (đo được node còn trống 2.3 GB), còn cái mất là **tính so
# sánh được của phép đo** — tức là mất chính thứ mà cả thí nghiệm fidelity dựa vào.
#
# Cấu hình giữ nguyên của production: USERS=10, RATE=1, và cùng một locustfile đã bỏ
# nhiễu số thẻ ngẫu nhiên. ConfigMap phải lặp lại ở đây vì kustomize không cho tham
# chiếu file nằm ngoài thư mục gốc.

apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgenerator-locustfile
data:
  locustfile.py: |
    #!/usr/bin/python
    #
    # Copyright 2018 Google LLC
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #      http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    import random

    # --- SUA CHO KHOA LUAN ---
    # Goc: fake.credit_card_number(card_type="visa") sinh so ngau nhien, thinh thoang
    # roi vao dai Visa Electron ma paymentservice tu choi -> khoang 1 den 9% don hang
    # that bai ngay ca khi he thong hoan toan khoe manh.
    # Nhieu nen do lam mo chi so "harmful action count" o muc 8 KLTN.md, nen thay bang
    # mot so the VISA co dinh hop le (chinh la so mac dinh tren form thanh toan cua web).
    VALID_VISA_CARD = "4432801561520454"
    from locust import FastHttpUser, TaskSet, between
    from faker import Faker
    import datetime
    fake = Faker()

    products = [
        '0PUK6V6EV0',
        '1YMWWN1N4O',
        '2ZYFJ3GM2N',
        '66VCHSJNUP',
        '6E92ZMYYFZ',
        '9SIQT8TOJO',
        'L9ECAV7KIM',
        'LS4PSXUNUM',
        'OLJCESPC7Z']

    def index(l):
        l.client.get("/")

    def setCurrency(l):
        currencies = ['EUR', 'USD', 'JPY', 'CAD', 'GBP', 'TRY']
        l.client.post("/setCurrency",
            {'currency_code': random.choice(currencies)})

    def browseProduct(l):
        l.client.get("/product/" + random.choice(products))

    def viewCart(l):
        l.client.get("/cart")

    def addToCart(l):
        product = random.choice(products)
        l.client.get("/product/" + product)
        l.client.post("/cart", {
            'product_id': product,
            'quantity': random.randint(1,10)})
    
    def empty_cart(l):
        l.client.post('/cart/empty')

    def checkout(l):
        addToCart(l)
        current_year = datetime.datetime.now().year+1
        l.client.post("/cart/checkout", {
            'email': fake.email(),
            'street_address': fake.street_address(),
            'zip_code': fake.zipcode(),
            'city': fake.city(),
            'state': fake.state_abbr(),
            'country': fake.country(),
            'credit_card_number': VALID_VISA_CARD,
            'credit_card_expiration_month': random.randint(1, 12),
            'credit_card_expiration_year': random.randint(current_year, current_year + 70),
            'credit_card_cvv': f"{random.randint(100, 999)}",
        })
    
    def logout(l):
        l.client.get('/logout')  


    class UserBehavior(TaskSet):

        def on_start(self):
            index(self)

        tasks = {index: 1,
            setCurrency: 2,
            browseProduct: 10,
            addToCart: 2,
            viewCart: 3,
            checkout: 1}

    class WebsiteUser(FastHttpUser):
        tasks = [UserBehavior]
        wait_time = between(1, 10)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
    app: loadgenerator
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: loadgenerator
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."
            STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
            if [ $STATUSCODE -eq 200 ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
        name: frontend-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"
      containers:
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator:v0.10.6
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"
        - name: USERS
          value: "10"
        - name: RATE
          value: "1"
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgenerator
