# Jaeger all-in-one: nơi lưu và xem trace.
# "all-in-one" = collector + storage + UI gói chung 1 container, lưu trong RAM.
# Đủ cho khóa luận. Đổi lại: xóa pod là mất hết trace cũ.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            # Bật cổng nhận OTLP. Không có dòng này thì collector gửi trace vào sẽ bị từ chối.
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # Giữ tối đa 3000 TRACE trong RAM.
            #
            # Đã hạ hai lần vì OOMKilled: 50000 -> 10000 -> 3000. Đo ngược từ lần chết
            # thứ hai thì mỗi trace tốn khoảng 50KB, nên 10000 trace vẫn vượt trần 512Mi.
            # Triệu chứng khi vượt: pod chết giữa chừng và script Python đang chạy nhận
            # `RemoteDisconnected`, làm hỏng nguyên một lượt thí nghiệm.
            #
            # 3000 trace vẫn thừa: hệ thống sinh khoảng 174 trace mỗi phút, tức chứa
            # được 17 phút, trong khi mọi phép đo chỉ nhìn lại 5 phút.
            - name: MEMORY_MAX_TRACES
              value: "3000"
          ports:
            - containerPort: 16686   # giao diện web
            - containerPort: 4317    # nhận OTLP qua gRPC
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
# Service nội bộ: để OTel Collector gửi trace tới jaeger:4317
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: query-http
      port: 16686
      targetPort: 16686
---
# Service mở ra ngoài: nodePort 30686 khớp extraPortMappings -> localhost:16686
apiVersion: v1
kind: Service
metadata:
  name: jaeger-external
  labels:
    app: jaeger
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: query-http
      port: 16686
      targetPort: 16686
      nodePort: 30686
