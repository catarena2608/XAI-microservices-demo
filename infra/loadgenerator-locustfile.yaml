    # limitations under the License.

    import random

    # --- SUA CHO KHOA LUAN ---
    # Goc: fake.credit_card_number(card_type="visa") sinh so ngau nhien, thinh thoang
    # roi vao dai Visa Electron ma paymentservice tu choi -> khoang 1 den 9% don hang
    # that bai ngay ca khi he thong hoan toan khoe manh.
    # Nhieu nen do lam mo chi so "harmful action count" o muc 8 KLTN.md, nen thay bang
    # mot so the VISA co dinh hop le (chinh la so mac dinh tren form thanh toan cua web).
    VALID_VISA_CARD = "4432801561520454"
    from locust import FastHttpUser, TaskSet, between
    from faker import Faker
    import datetime
    fake = Faker()

    products = [
        '0PUK6V6EV0',
        '1YMWWN1N4O',
        '2ZYFJ3GM2N',
        '66VCHSJNUP',
        '6E92ZMYYFZ',
        '9SIQT8TOJO',
        'L9ECAV7KIM',
        'LS4PSXUNUM',
        'OLJCESPC7Z']

    def index(l):
        l.client.get("/")

    def setCurrency(l):
        currencies = ['EUR', 'USD', 'JPY', 'CAD', 'GBP', 'TRY']
        l.client.post("/setCurrency",
            {'currency_code': random.choice(currencies)})

    def browseProduct(l):
        l.client.get("/product/" + random.choice(products))

    def viewCart(l):
        l.client.get("/cart")

    def addToCart(l):
        product = random.choice(products)
        l.client.get("/product/" + product)
        l.client.post("/cart", {
            'product_id': product,
            'quantity': random.randint(1,10)})
    
    def empty_cart(l):
        l.client.post('/cart/empty')

    def checkout(l):
        addToCart(l)
        current_year = datetime.datetime.now().year+1
        l.client.post("/cart/checkout", {
            'email': fake.email(),
            'street_address': fake.street_address(),
            'zip_code': fake.zipcode(),
            'city': fake.city(),
            'state': fake.state_abbr(),
            'country': fake.country(),
            'credit_card_number': VALID_VISA_CARD,
            'credit_card_expiration_month': random.randint(1, 12),
            'credit_card_expiration_year': random.randint(current_year, current_year + 70),
            'credit_card_cvv': f"{random.randint(100, 999)}",
        })
    
    def logout(l):
        l.client.get('/logout')  


    class UserBehavior(TaskSet):

        def on_start(self):
            index(self)

        tasks = {index: 1,
            setCurrency: 2,
            browseProduct: 10,
            addToCart: 2,
            viewCart: 3,
            checkout: 1}

    class WebsiteUser(FastHttpUser):
        tasks = [UserBehavior]
        wait_time = between(1, 10)
