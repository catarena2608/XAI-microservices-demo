# Ghi de locustfile.py cua loadgenerator de bo nhieu loi nen.
# Xem giai thich trong chinh noi dung file ben duoi.
# KHONG dung image moi: chi gan de file bang ConfigMap qua subPath.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgenerator-locustfile
data:
  locustfile.py: |
    #!/usr/bin/python
    #
